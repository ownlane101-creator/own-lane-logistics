<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grit">
<title>Own Lane Grit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root { --bg:#0b0b0f; --card:#16161d; --line:#26262f; --text:#f2f2f5; --dim:#8a8a96; --gold:#f5a623; --good:#3ddc84; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system, system-ui, sans-serif;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); max-width:520px; margin-inline:auto; }
header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
header h1 { font-size:22px; margin:0; letter-spacing:.5px; flex:1; }
header h1 span { color:var(--gold); }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; }
.hero { display:flex; justify-content:space-between; align-items:flex-end; }
.lvl { font-size:44px; font-weight:800; line-height:1; }
.rank { color:var(--gold); font-weight:700; letter-spacing:2px; text-transform:uppercase; font-size:13px; margin-top:6px; }
.streak { text-align:right; }
.streak b { font-size:30px; display:block; }
.streak small, .sub { color:var(--dim); font-size:12px; }
.bar { height:10px; background:#24242c; border-radius:6px; margin:14px 0 6px; overflow:hidden; }
.bar i { display:block; height:100%; background:linear-gradient(90deg, #c77d0a, var(--gold)); border-radius:6px; transition:width .4s; }
.row { display:flex; justify-content:space-between; }
.week { display:flex; justify-content:space-between; gap:4px; }
.week button { flex:1; background:none; border:0; color:var(--dim); font:inherit; font-size:12px; padding:4px 0; }
.week .dot { width:34px; height:34px; margin:4px auto 0; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; color:var(--bg); font-weight:800; }
.week .full .dot { background:var(--good); border-color:var(--good); }
.week .part .dot { border-color:var(--good); color:var(--good); }
.week .sel { color:var(--text); }
.week .sel .dot { outline:2px solid var(--gold); outline-offset:2px; }
.week button:disabled { opacity:.3; }
h2 { font-size:15px; margin:0 0 10px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:1px; }
.habit { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
.habit:first-of-type { border-top:0; }
.check { width:30px; height:30px; flex:none; border-radius:9px; border:2px solid #444; background:none; color:var(--bg); font-weight:900; font-size:18px; }
.habit.on .check { background:var(--good); border-color:var(--good); }
.habit.on .name { color:var(--dim); text-decoration:line-through; }
.name { flex:1; }
.xp { font-size:12px; color:var(--gold); font-weight:700; }
.del { background:none; border:0; color:#ff5d5d; font-size:20px; display:none; padding:0 4px; }
.editing .del { display:block; }
form { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
form input { flex-basis:100%; }
input, select { background:#0f0f14; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; min-width:0; }
input { flex:1; }
.btn { background:var(--gold); color:#111; border:0; border-radius:10px; padding:10px 14px; font-weight:700; font:inherit; font-weight:700; }
.link { background:none; border:0; color:var(--gold); font:inherit; font-size:14px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; gap:8px; }
.stats b { display:block; font-size:22px; }
#toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%) translateY(120px); background:var(--gold); color:#111; font-weight:800; padding:12px 20px; border-radius:14px; transition:transform .3s; white-space:nowrap; }
#toast.show { transform:translateX(-50%); }
.empty { color:var(--dim); text-align:center; padding:10px 0; }
</style>
</head>
<body>
<header>
  <img src="icon.svg" alt="" width="34" height="34">
  <h1>Own Lane <span>Grit</span></h1>
</header>

<section class="card">
  <div class="hero">
    <div><div class="lvl" id="lvl">Lv 1</div><div class="rank" id="rank">Iron IV</div></div>
    <div class="streak"><b id="streak">0 🔥</b><small>day streak</small></div>
  </div>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div class="row sub"><span id="xpTotal">0 XP</span><span id="xpNext"></span></div>
</section>

<section class="card"><div class="week" id="week"></div></section>

<section class="card" id="list">
  <div class="row"><h2 id="dayTitle">Today</h2><button class="link" id="editBtn">Edit</button></div>
  <div id="habits"></div>
  <form id="add">
    <input id="newName" placeholder="New habit (e.g. Read 10 pages)" maxlength="60" autocomplete="off">
    <select id="newXp" aria-label="Difficulty"><option value="10">Easy +10</option><option value="20" selected>Normal +20</option><option value="35">Hard +35</option></select>
    <button class="btn" aria-label="Add habit">+</button>
  </form>
</section>

<section class="card stats">
  <div><b id="best">0</b><span class="sub">best streak</span></div>
  <div><b id="perfect">0</b><span class="sub">perfect days</span></div>
  <div><b id="checks">0</b><span class="sub">habits done</span></div>
</section>

<p class="sub" style="text-align:center">Saved on this phone only. Tap Share → Add to Home Screen to install.</p>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
